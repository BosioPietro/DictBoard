name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The runner has the Android SDK (ANDROID_HOME), so the app is built too.
      - run: ./gradlew :dictionary:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dictboard-debug
          path: app/build/outputs/apk/debug/*.apk
